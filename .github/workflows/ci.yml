name: CI

on:
  pull_request:
    branches: ["**"]
    types: [labeled, unlabeled, opened, synchronize, reopened]

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  pull-requests: write # report coverage

# Cancel previous workflows if they are the same workflow on same ref (branch/tags)
# with the same event (push/pull_request) even they are in progress.
# This setting will help reduce the number of duplicated workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Runs on self hosted runner
# If you want to use GitHub hosted runner, change `runs-on` to ubuntu-latest
jobs:
  ci-pre-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Fetch target branch
        run: git fetch origin ${{ github.base_ref }}
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Check if "console.log" is used
        run: |
          if bash scripts/is_contain.sh "^\+.*(console\.log|console\.error)"; then
            echo "console.log is used, please remove it before merging";
            gh pr comment $PR_URL --body "console.log 발견 👀"
            exit 1;
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Check Lint
        run: |
          if bash scripts/is_package_updated.sh 'apps|libs|packages'; then
            yarn lint;
          else
            echo "No code changes, skip lint check";
          fi
      - name: Build apps
        run: yarn build --filter=...[${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}]
      - name: Check types
        run: yarn type-check --filter=...[${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}]
      - name: Run tests
        id: tests
        run: |
          bash scripts/run_coverage.sh || exit $?
          if [ -f coverage/coverage-summary.json ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report coverage
        if: steps.tests.outputs.has_coverage == 'true'
        uses:  davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
