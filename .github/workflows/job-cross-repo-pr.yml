name: Job Cross Repo PR

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      environment:
        required: true
        type: string
      stable_version:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      ci_result:
        required: true
        type: string
      build_result:
        required: true
        type: string
      tag_push_result:
        required: true
        type: string
    secrets:
      GIT_APP_ID:
        required: true
      GIT_APP_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}-${{ inputs.image_tag }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      CHANNEL_ENVIRONMENT: ${{ inputs.environment }}
      STABLE_VERSION: ${{ inputs.stable_version }}
      TARGET_SHA: ${{ inputs.resolved_sha }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_REPOSITORY: ${{ vars.HELM_CHART_VALUES_REPO }}
      SCRIPT_PATH: ${{ vars.SCRIPT_PATH }}
      TARGET_SERVICES: ${{ vars.CHANNEL_DEPLOY_SERVICES }}
      BRANCH_NAME: chore/update-channel-image-${{ inputs.environment }}-${{ github.run_id }}
    steps:
      - name: Validate workflow variables
        id: validate_vars
        continue-on-error: true
        run: |
          if [ -z "$TARGET_REPOSITORY" ]; then
            echo "Repository variable HELM_CHART_VALUES_REPO is required" >&2
            exit 1
          fi

          if [ -z "$SCRIPT_PATH" ]; then
            echo "Repository variable SCRIPT_PATH is required" >&2
            exit 1
          fi

          if [ -z "$TARGET_SERVICES" ]; then
            echo "Repository variable CHANNEL_DEPLOY_SERVICES is required" >&2
            exit 1
          fi

      - name: Create GitHub App token
        id: app_token
        if: ${{ steps.validate_vars.outcome == 'success' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GIT_APP_ID }}
          private-key: ${{ secrets.GIT_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Checkout values repository
        id: checkout_values
        if: ${{ steps.app_token.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          path: values-repo

      - name: Validate script path
        id: validate_script_path
        if: ${{ steps.checkout_values.outcome == 'success' }}
        continue-on-error: true
        working-directory: values-repo
        run: |
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "Script not found: $SCRIPT_PATH" >&2
            exit 1
          fi

      - name: Resolve target environment
        id: resolve_environment
        if: ${{ steps.validate_script_path.outcome == 'success' }}
        continue-on-error: true
        run: |
          case "$CHANNEL_ENVIRONMENT" in
            rc)
              echo "value=stg" >> "$GITHUB_OUTPUT"
              ;;
            hotfix)
              echo "value=prod" >> "$GITHUB_OUTPUT"
              ;;
            loadtest)
              echo "value=lt" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "value=dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported channel environment: $CHANNEL_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

      - name: Update image tags for all services
        id: update_values
        if: ${{ steps.resolve_environment.outcome == 'success' }}
        continue-on-error: true
        working-directory: values-repo
        env:
          TARGET_ENVIRONMENT: ${{ steps.resolve_environment.outputs.value }}
        run: |
          chmod +x "$SCRIPT_PATH"

          for service in $TARGET_SERVICES; do
            "./$SCRIPT_PATH" "$service" "$TARGET_ENVIRONMENT" "$IMAGE_TAG"
          done

      - name: Check for changes
        id: changes
        if: ${{ steps.update_values.outcome == 'success' }}
        continue-on-error: true
        working-directory: values-repo
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: create_pr
        if: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.has_changes == 'true' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          path: values-repo
          branch: ${{ env.BRANCH_NAME }}
          base: main
          add-paths: .
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "chore: update ${{ inputs.environment }} image tag to ${{ inputs.image_tag }}"
          commit-message: "chore: update ${{ inputs.environment }} image tag to ${{ inputs.image_tag }}"
          body: |
            ## Summary

            `${{ steps.resolve_environment.outputs.value }}` 환경 이미지 버전을 `${{ inputs.image_tag }}` 으로 변경함.

            ## Describe your changes

            values repo 내 배포 대상 서비스들의 이미지 태그를 `${{ inputs.image_tag }}` 으로 일괄 수정함.
            실행 채널은 `${{ inputs.environment }}` 이고, 실제 반영 환경값은 `${{ steps.resolve_environment.outputs.value }}` 임.
            대상 서비스는 `${{ vars.CHANNEL_DEPLOY_SERVICES }}` 임.

            ## Task Link

            N/A

            ## Reviewer Tag
          delete-branch: true

      - name: Write summary
        if: ${{ always() }}
        env:
          VALUES_PR_RESULT: ${{ steps.create_pr.outcome }}
          CHANGES_DETECTED: ${{ steps.changes.outputs.has_changes }}
        run: |
          if [ "$CHANGES_DETECTED" = "false" ]; then
            values_pr_result="no_changes"
          elif [ -n "$VALUES_PR_RESULT" ]; then
            values_pr_result="$VALUES_PR_RESULT"
          else
            values_pr_result="skipped"
          fi

          {
            printf '%s\n' '## Manual Channel Result'
            printf '%s\n' "- source_ref: \`${SOURCE_REF}\`"
            printf '%s\n' "- environment: \`${CHANNEL_ENVIRONMENT}\`"
            printf '%s\n' "- stable_version: \`${STABLE_VERSION}\`"
            printf '%s\n' "- resolved_sha: \`${TARGET_SHA}\`"
            printf '%s\n' "- ci_result: \`${{ inputs.ci_result }}\`"
            printf '%s\n' "- image_tag: \`${IMAGE_TAG}\`"
            printf '%s\n' "- build_result: \`${{ inputs.build_result }}\`"
            printf '%s\n' "- tag_push_result: \`${{ inputs.tag_push_result }}\`"
            printf '%s\n' "- values_pr_result: \`${values_pr_result}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if deployment sync failed
        if: ${{ always() }}
        run: |
          if [ "${{ steps.validate_vars.outcome }}" = "failure" ] || \
             [ "${{ steps.app_token.outcome }}" = "failure" ] || \
             [ "${{ steps.checkout_values.outcome }}" = "failure" ] || \
             [ "${{ steps.validate_script_path.outcome }}" = "failure" ] || \
             [ "${{ steps.resolve_environment.outcome }}" = "failure" ] || \
             [ "${{ steps.update_values.outcome }}" = "failure" ] || \
             [ "${{ steps.changes.outcome }}" = "failure" ]; then
            echo "Values PR preparation failed" >&2
            exit 1
          fi

          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ] && [ "${{ steps.create_pr.outcome }}" != "success" ]; then
            echo "Pull request creation failed" >&2
            exit 1
          fi
