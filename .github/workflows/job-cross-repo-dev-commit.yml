name: Job Cross Repo Dev Commit

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      ci_result:
        required: true
        type: string
      build_result:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate values repository dev commit
        run: |
          {
            printf '%s\n' '## Simulated Dev Values Commit'
            printf '%s\n' "- source_ref: \`${{ inputs.source_ref }}\`"
            printf '%s\n' "- resolved_sha: \`${{ inputs.resolved_sha }}\`"
            printf '%s\n' "- image_tag: \`${{ inputs.image_tag }}\`"
            printf '%s\n' "- ci_result: \`${{ inputs.ci_result }}\`"
            printf '%s\n' "- build_result: \`${{ inputs.build_result }}\`"
            printf '%s\n' '- mode: `simulated_cross_repo_dev_commit`'
          } >> "$GITHUB_STEP_SUMMARY"
