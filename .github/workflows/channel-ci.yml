name: Channel CI

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.resolved_sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.resolved_sha }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run type-check
        run: yarn type-check

      - name: Run tests
        run: yarn test --run

      - name: Write summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Channel CI
          - source_ref: \`${{ inputs.source_ref }}\`
          - resolved_sha: \`${{ inputs.resolved_sha }}\`
          - lint: \`passed\`
          - type-check: \`passed\`
          - test: \`passed\`
          EOF
