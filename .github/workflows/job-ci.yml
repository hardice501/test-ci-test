name: Job CI

on:
  pull_request:
    branches: ["**"]
    types: [labeled, unlabeled, opened, synchronize, reopened]
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.resolved_sha || github.ref || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.resolved_sha || '' }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Fetch target branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin "${{ github.base_ref }}"

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Check if "console.log" is used
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if bash scripts/is_contain.sh "^\+.*(console\.log|console\.error)"; then
            echo "console.log is used, please remove it before merging" >&2
            gh pr comment "$PR_URL" --body "console.log 발견 👀"
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if bash scripts/is_package_updated.sh 'apps|libs|packages|tests'; then
              yarn lint
            else
              echo "No code changes, skip lint check"
            fi
          else
            yarn lint
          fi

      - name: Build apps
        if: ${{ github.event_name == 'pull_request' }}
        run: yarn build --filter=...[${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}]

      - name: Build apps for channel workflows
        if: ${{ github.event_name != 'pull_request' }}
        run: yarn build

      - name: Run type-check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            yarn type-check --filter=...[${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}]
          else
            yarn type-check
          fi

      - name: Run tests
        id: tests
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/run_coverage.sh || exit $?
            if [ -f coverage/coverage-summary.json ]; then
              echo "has_coverage=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            fi
          else
            yarn test --run
          fi

      - name: Report coverage
        if: ${{ github.event_name == 'pull_request' && steps.tests.outputs.has_coverage == 'true' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

      - name: Write summary
        if: ${{ always() }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            {
              printf '%s\n' '## Pull Request CI'
              printf '%s\n' "- base_ref: \`${{ github.base_ref }}\`"
              printf '%s\n' "- head_ref: \`${{ github.head_ref }}\`"
              printf '%s\n' "- base_sha: \`${{ github.event.pull_request.base.sha }}\`"
              printf '%s\n' "- head_sha: \`${{ github.event.pull_request.head.sha }}\`"
              printf '%s\n' '- lint: `passed`'
              printf '%s\n' '- build: `passed`'
              printf '%s\n' '- type-check: `passed`'
              printf '%s\n' '- test: `passed`'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              printf '%s\n' '## Channel CI'
              printf '%s\n' "- source_ref: \`${{ inputs.source_ref }}\`"
              printf '%s\n' "- resolved_sha: \`${{ inputs.resolved_sha }}\`"
              printf '%s\n' '- lint: `passed`'
              printf '%s\n' '- build: `passed`'
              printf '%s\n' '- type-check: `passed`'
              printf '%s\n' '- test: `passed`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
