name: Image Build Push on Branch by Merged

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      last_head: ${{ steps.meta.outputs.last_head }}
      feature_head: ${{ steps.meta.outputs.feature_head }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      secret_prefix: ${{ steps.meta.outputs.secret_prefix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail

          FEATURE_HEAD="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "HEAD^1^{commit}" >/dev/null 2>&1; then
            LAST_HEAD="$(git rev-parse HEAD^1)"
          else
            LAST_HEAD="$(git hash-object -t tree /dev/null)"
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            MERGE_MESSAGE="$(git log -1 --format="%B")"
            IMAGE_TAG="$(echo "$MERGE_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            if [ -z "$IMAGE_TAG" ]; then
              echo "Could not extract stable version from main merge commit message" >&2
              echo "Merge commit message: $MERGE_MESSAGE" >&2
              exit 1
            fi
            SECRET_PREFIX="PROD"
          else
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            IMAGE_TAG="dev-${SHORT_SHA}"
            SECRET_PREFIX="DEV"
          fi

          echo "last_head=$LAST_HEAD" >> "$GITHUB_OUTPUT"
          echo "feature_head=$FEATURE_HEAD" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "secret_prefix=$SECRET_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            printf '%s\n' '## Build Prepare'
            printf '%s\n' "- branch: \`${{ github.ref_name }}\`"
            printf '%s\n' "- image_tag: \`${{ steps.meta.outputs.image_tag }}\`"
            printf '%s\n' "- secret_prefix: \`${{ steps.meta.outputs.secret_prefix }}\`"
            printf '%s\n' "- feature_head: \`${{ steps.meta.outputs.feature_head }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: prepare
    uses: ./.github/workflows/job-ci.yml
    with:
      source_ref: ${{ github.ref_name }}
      resolved_sha: ${{ needs.prepare.outputs.feature_head }}
    secrets: inherit

  build-and-push:
    needs:
      - prepare
      - ci
    uses: ./.github/workflows/job-image-build-push.yml
    with:
      last_head: ${{ needs.prepare.outputs.last_head }}
      feature_head: ${{ needs.prepare.outputs.feature_head }}
      secret_prefix: ${{ needs.prepare.outputs.secret_prefix }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      channel_tag: ${{ github.ref_name == 'main' && 'latest' || '' }}
    secrets: inherit

  push-tag:
    needs:
      - prepare
      - ci
      - build-and-push
    if: ${{ github.ref_name == 'main' }}
    uses: ./.github/workflows/job-image-tag-resolve.yml
    with:
      tag_name: ${{ needs.prepare.outputs.image_tag }}
      target_sha: ${{ needs.prepare.outputs.feature_head }}
    secrets: inherit
