name: Channel Update Values PR

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      GITHUB_APP_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  update-values-pr:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: ${{ vars.HELM_CHART_VALUES_REPO }}
      SCRIPT_PATH: ${{ vars.SCRIPT_PATH }}
      TARGET_SERVICES: ${{ vars.CHANNEL_DEPLOY_SERVICES }}
      CHANNEL_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.version }}
      BRANCH_NAME: chore/update-channel-image-${{ inputs.environment }}-${{ github.run_id }}
    steps:
      - name: Validate workflow variables
        run: |
          if [ -z "$TARGET_REPOSITORY" ]; then
            echo "Repository variable HELM_CHART_VALUES_REPO is required" >&2
            exit 1
          fi

          if [ -z "$SCRIPT_PATH" ]; then
            echo "Repository variable SCRIPT_PATH is required" >&2
            exit 1
          fi

          if [ -z "$TARGET_SERVICES" ]; then
            echo "Repository variable CHANNEL_DEPLOY_SERVICES is required" >&2
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Checkout values repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          path: values-repo

      - name: Validate script path
        working-directory: values-repo
        run: |
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "Script not found: $SCRIPT_PATH" >&2
            exit 1
          fi

      - name: Resolve target environment
        id: resolve-environment
        run: |
          case "$CHANNEL_ENVIRONMENT" in
            rc)
              echo "value=stg" >> "$GITHUB_OUTPUT"
              ;;
            hotfix)
              echo "value=prod" >> "$GITHUB_OUTPUT"
              ;;
            loadtest)
              echo "value=lt" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "value=dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported channel environment: $CHANNEL_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

      - name: Update image tags for all services
        working-directory: values-repo
        env:
          TARGET_ENVIRONMENT: ${{ steps.resolve-environment.outputs.value }}
        run: |
          chmod +x "$SCRIPT_PATH"

          for service in $TARGET_SERVICES; do
            "./$SCRIPT_PATH" "$service" "$TARGET_ENVIRONMENT" "$IMAGE_TAG"
          done

      - name: Check for changes
        id: changes
        working-directory: values-repo
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git user
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: values-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "zkrypto@zkrypto.com"

      - name: Commit and push branch
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: values-repo
        run: |
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "chore: update ${CHANNEL_ENVIRONMENT} image tag to ${IMAGE_TAG}"
          git push origin "$BRANCH_NAME"

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: values-repo
          branch: ${{ env.BRANCH_NAME }}
          base: main
          title: "chore: update ${{ inputs.environment }} image tag to ${{ inputs.version }}"
          commit-message: "chore: update ${{ inputs.environment }} image tag to ${{ inputs.version }}"
          body: |
            ## Summary

            `${{ steps.resolve-environment.outputs.value }}` 환경 이미지 버전을 `${{ inputs.version }}` 으로 변경함.

            ## Describe your changes

            values repo 내 배포 대상 서비스들의 이미지 태그를 `${{ inputs.version }}` 으로 일괄 수정함.
            실행 채널은 `${{ inputs.environment }}` 이고, 실제 반영 환경값은 `${{ steps.resolve-environment.outputs.value }}` 임.
            대상 서비스는 `${{ vars.CHANNEL_DEPLOY_SERVICES }}` 임.

            ## Task Link

            N/A

            ## Reviewer Tag

            @hardice501 @mclub4
          delete-branch: true

      - name: Write summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Values PR
          - repository: `${TARGET_REPOSITORY}`
          - script_path: `${SCRIPT_PATH}`
          - services: `${TARGET_SERVICES}`
          - channel_environment: `${CHANNEL_ENVIRONMENT}`
          - target_environment: `${{ steps.resolve-environment.outputs.value }}`
          - image_tag: `${IMAGE_TAG}`
          - branch: `${BRANCH_NAME}`
          - changes_detected: `${{ steps.changes.outputs.has_changes }}`
          EOF
