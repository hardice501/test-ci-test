name: Image Build Push on Tag

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        type: choice
        options:
          - rc
          - hotfix
          - loadtest
      stable_version:
        description: "최신 stable 기준 버전 수동 입력. 예: v1.2.3 또는 1.2.3. 최종 결과는 v1.2.3-{env}.1 형태로 자동 계산됨"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  calculate:
    uses: ./.github/workflows/job-validate-image-tag.yml
    with:
      source_ref: ${{ github.ref_name }}
      environment: ${{ github.event.inputs.environment }}
      stable_version: ${{ github.event.inputs.stable_version }}
    secrets: inherit

  ci:
    needs:
      - calculate
    uses: ./.github/workflows/job-ci.yml
    with:
      source_ref: ${{ github.ref_name }}
      resolved_sha: ${{ needs.calculate.outputs.resolved_sha }}
    secrets: inherit

  build-and-push:
    needs:
      - calculate
      - ci
    uses: ./.github/workflows/job-image-build-push.yml
    with:
      last_head: ${{ needs.calculate.outputs.prev_tag_sha }}
      feature_head: ${{ needs.calculate.outputs.resolved_sha }}
      secret_prefix: ${{ github.event.inputs.environment == 'rc' && 'STAG' || github.event.inputs.environment == 'hotfix' && 'PROD' || 'LOADTEST' }}
      image_tag: ${{ needs.calculate.outputs.next_tag }}
      channel_tag: ${{ github.event.inputs.environment == 'rc' && 'staging' || github.event.inputs.environment == 'hotfix' && 'production' || 'loadtest' }}
    secrets: inherit

  push-tag:
    needs:
      - calculate
      - ci
      - build-and-push
    uses: ./.github/workflows/job-image-tag-resolve.yml
    with:
      tag_name: ${{ needs.calculate.outputs.next_tag }}
      target_sha: ${{ needs.calculate.outputs.resolved_sha }}
    secrets: inherit

  deployment-sync:
    needs:
      - calculate
      - ci
      - build-and-push
      - push-tag
    if: ${{ always() && needs.push-tag.result == 'success' }}
    uses: ./.github/workflows/job-cross-repo-pr.yml
    with:
      source_ref: ${{ github.ref_name }}
      environment: ${{ github.event.inputs.environment }}
      stable_version: ${{ github.event.inputs.stable_version }}
      resolved_sha: ${{ needs.calculate.outputs.resolved_sha }}
      image_tag: ${{ needs.calculate.outputs.next_tag }}
      ci_result: ${{ needs.ci.result }}
      build_result: ${{ needs.build-and-push.result }}
      tag_push_result: ${{ needs.push-tag.result }}
    secrets: inherit
