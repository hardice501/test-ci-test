name: "[Manual] Create Main Merge PR"

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: "릴리즈 stable 버전. 예: v1.2.3"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.stable_version }}
  cancel-in-progress: false

jobs:
  prepare-main-merge-pr:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.ref_name }}
      TARGET_BASE_BRANCH: main
      INPUT_STABLE_VERSION: ${{ github.event.inputs.stable_version }}
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GIT_APP_ID }}
          private-key: ${{ secrets.GIT_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Validate source branch
        run: |
          if [ "$SOURCE_REF" = "$TARGET_BASE_BRANCH" ]; then
            echo "Source branch must be different from target base branch" >&2
            exit 1
          fi

      - name: Validate stable version and existing tag
        id: validate
        run: |
          set -euo pipefail

          if [[ "$INPUT_STABLE_VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            PACKAGE_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$INPUT_STABLE_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            PACKAGE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "Unsupported stable version format: $INPUT_STABLE_VERSION" >&2
            exit 1
          fi

          TAG_VERSION="v${PACKAGE_VERSION}"

          git fetch --force --tags --prune origin

          if git rev-parse -q --verify "refs/tags/${TAG_VERSION}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG_VERSION}" >&2
            exit 1
          fi

          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Detect monorepo structure
        run: |
          if [ -f turbo.json ]; then
            echo "Monorepo structure: turbo"
          elif jq -e '.workspaces' package.json >/dev/null 2>&1; then
            echo "Monorepo structure: npm-workspaces"
          else
            echo "Unsupported monorepo structure" >&2
            exit 1
          fi

      - name: Update package versions
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            tmp_file="$(mktemp)"
            jq --arg version "${{ steps.validate.outputs.package_version }}" '.version = $version' "$file" > "$tmp_file"
            mv "$tmp_file" "$file"
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -name package.json -print | sort)

      - name: Check for version changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push source branch
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: prepare main merge for ${{ steps.validate.outputs.tag_version }}"
          git push origin "HEAD:${SOURCE_REF}"

      - name: Create pull request
        id: create_pr
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          pr_body="$(cat <<EOF
          ## Summary

          - source_ref: \`${SOURCE_REF}\`
          - target_base_branch: \`${TARGET_BASE_BRANCH}\`
          - stable_version: \`${{ steps.validate.outputs.tag_version }}\`

          ## Notes

          merge title에 \`${{ steps.validate.outputs.tag_version }}\` 유지 필요함.
          EOF
          )"
          pr_url="$(gh pr create \
            --base "$TARGET_BASE_BRANCH" \
            --head "$SOURCE_REF" \
            --title "release ${{ steps.validate.outputs.tag_version }}" \
            --body "$pr_body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            printf '%s\n' '## Main Merge PR'
            printf '%s\n' "- source_ref: \`${SOURCE_REF}\`"
            printf '%s\n' "- target_base_branch: \`${TARGET_BASE_BRANCH}\`"
            printf '%s\n' "- stable_version: \`${{ steps.validate.outputs.tag_version }}\`"
            printf '%s\n' "- changes_detected: \`${{ steps.changes.outputs.has_changes }}\`"
            printf '%s\n' "- branch: \`${BRANCH_NAME}\`"
            printf '%s\n' "- pr_url: \`${{ steps.create_pr.outputs.url || 'not_created' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
